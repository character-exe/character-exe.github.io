:root{color-scheme:dark;--bg:#101619;--panel:#192327;--line:#34464a;--ink:#eef3e9;--muted:#aebdb9;--accent:#d9f185}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 85% 0%,#294039 0,transparent 55%),var(--bg);color:var(--ink);font:17px/1.65 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;min-height:100vh;-webkit-font-smoothing:antialiased}button,textarea{font:inherit}button{cursor:pointer;transition:border-color .15s,background .15s,transform .15s;border:1px solid var(--line);border-radius:7px;background:var(--panel);color:var(--ink);padding:12px 20px;text-align:left}button:hover{border-color:var(--accent);background:#283732}button:focus-visible,textarea:focus-visible,summary:focus-visible{outline:3px solid var(--accent);outline-offset:4px}button.primary{background:var(--accent);color:#172019;font-weight:700;border-color:var(--accent)}button:disabled{opacity:.5;cursor:default}header{max-width:1200px;margin:auto;padding:26px 30px;display:flex;justify-content:space-between;align-items:center;gap:20px;border-bottom:1px solid var(--line)}.logo{font-family:monospace;font-size:21px;font-weight:700}.logo span{color:var(--accent)}header button{padding:6px 12px;font-size:14px}main{max-width:1200px;margin:0 auto;padding:48px 30px 70px}.eyebrow{color:var(--accent);font:12px/1.5 monospace;letter-spacing:2px;text-transform:uppercase}h1{font-size:clamp(38px,6vw,76px);line-height:1.06;letter-spacing:-2px;margin:18px 0 26px;max-width:850px}h2{font-size:clamp(28px,4vw,43px);line-height:1.2;letter-spacing:-1px;margin:15px 0 22px}h3{margin:0 0 8px;font-size:20px}p{margin:0 0 20px}.muted,small{color:var(--muted)}.lead{font-size:21px;max-width:720px}.grid{display:grid;grid-template-columns:1fr 300px;gap:45px}.panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:24px;margin-bottom:20px}.actions{display:flex;gap:12px;flex-wrap:wrap;margin-top:26px}.characters,.lenses{display:grid;grid-template-columns:repeat(2,1fr);gap:16px}.character{padding:28px;min-height:170px}.character .number{font:13px monospace;color:var(--accent)}.character strong{display:block;font-size:32px;margin:10px 0}.character span{display:block;color:var(--muted)}.choices{display:grid;gap:15px;margin-top:30px}.choice{padding:22px 24px;width:100%;display:flex;gap:20px;align-items:baseline}.choice b{font-family:monospace;color:var(--accent)}.choice span{display:block}.quote{border-left:3px solid var(--accent);padding-left:20px;font-size:20px}.progress{display:flex;gap:8px;margin:15px 0 30px}.progress span{height:4px;flex:1;background:var(--line);border-radius:2px}.progress .done{background:var(--accent)}.receipt{border-top:1px solid var(--line);padding:14px 0}.receipt strong{display:block;font-size:14px}.receipt p{font-size:14px;margin:6px 0}.status{color:var(--accent);font:12px monospace}.notice{font-size:14px;color:var(--muted)}textarea{width:100%;min-height:125px;resize:vertical;background:#101619;color:var(--ink);padding:14px;border:1px solid var(--line);border-radius:6px;margin-top:10px}label{display:block;font-weight:600}details{border:1px solid var(--line);padding:18px;border-radius:8px;margin:24px 0}summary{cursor:pointer}footer{max-width:1200px;margin:auto;padding:24px 30px;text-align:center;color:var(--muted);border-top:1px solid var(--line);font-size:12px}.archive-art{height:220px;position:relative;overflow:hidden;background:repeating-linear-gradient(0deg,transparent 0 27px,#34464a55 28px 29px);border:1px solid var(--line);border-radius:8px;margin-bottom:25px}.archive-art:before{content:'CASE 05 / 05\A RECEIPTS\A MESSAGES\A MEMORY\A ?';white-space:pre;position:absolute;left:35px;top:25px;transform:rotate(-7deg);background:#d9f185;color:#172019;padding:18px 30px;font:14px/1.8 monospace;box-shadow:16px 14px 0 #628876}.badge{display:inline-block;border:1px solid var(--line);border-radius:20px;padding:3px 12px;font-size:12px;margin:5px 6px 5px 0}@media(max-width:800px){.grid{grid-template-columns:1fr;gap:20px}main{padding:30px 20px}header{padding:20px}.characters,.lenses{grid-template-columns:1fr}h1{letter-spacing:-2px}aside{order:2}}@media print{body{background:white;color:black}header,footer,.actions,button,details,.archive-art{display:none}.grid{display:block}main{padding:0}.panel{background:white;color:black;border:1px solid #aaa;break-inside:avoid}.muted,.eyebrow,.status,small{color:#333}textarea{background:white;color:black;height:auto;border:0}h1,h2{font-size:28px}.print-answer{white-space:pre-wrap}}

.archive-doc{background:#eee9dc;color:#242d2b;border:0;border-radius:6px;margin:14px 0;padding:0;overflow:hidden}.archive-doc summary{padding:17px 20px;font-weight:650}.archive-doc[open] summary{border-bottom:1px solid #bbb7aa}.document-body{padding:22px;white-space:pre-wrap;font:15px/1.8 ui-monospace,monospace;max-height:520px;overflow:auto}.archive-meta{font:12px monospace;color:#b3c6bd;display:block;margin:4px 0 16px}.curator{background:#202f2c;border-left:3px solid #d9f185;border-radius:0 10px 10px 0;padding:22px 24px;margin:25px 0}.curator p{margin:10px 0 0}.artifact-list{margin-top:25px}.archive-intro{font-size:18px;max-width:760px}.source-label{font:11px monospace;letter-spacing:1px;color:#617363;display:block}.document-body:focus{outline:3px solid #536d2c;outline-offset:-3px}@media print{.archive-doc,.curator{display:none}}
.student-start ol{padding-left:24px}.student-start li{margin-bottom:12px}.choice-instruction{padding:16px;border:1px solid var(--accent);border-radius:7px}.artifact-list ul{padding-left:24px}.artifact-list li{margin-bottom:12px}.guide-heading{display:flex;align-items:center;gap:16px;margin-bottom:18px}.guide-heading h3{margin:0;font-size:24px}.guide-icon{display:grid;place-items:center;width:48px;height:48px;flex-shrink:0;background:var(--accent);color:#172019;border-radius:50%;font:700 25px monospace}.guide .quote{font-size:22px;line-height:1.5;margin:18px 0}.guide-context{color:var(--ink);font-size:16px}.guide small{display:block;margin-top:14px;font-size:12px}.character:hover,.choice:hover{transform:translateY(-2px)}@media(prefers-reduced-motion:reduce){button{transition:none}.character:hover,.choice:hover{transform:none}}.character .portrait{display:block;height:220px;margin:-28px -28px 18px;background:radial-gradient(circle at 50% 75%,#294039 0,transparent 65%);border-bottom:1px solid var(--line);border-radius:7px 7px 0 0;overflow:hidden;text-align:center}.character .portrait img{height:100%;width:auto;max-width:100%;object-fit:contain;object-position:bottom;vertical-align:bottom;transition:transform .3s}.character:hover .portrait img{transform:scale(1.03)}@media print{.character .portrait{display:none}}</style></head><body><header><div class="logo">Character<span>.exe</span></div><button id="home">About / instructions</button></header><main id="app"></main><footer>Campaign by Roger Gude · Character.exe by Hang Yuan &amp; Roger Gude • Classroom HTML adaptation • Fictional scenario, no personality scoring</footer><noscript>This interactive demo requires JavaScript. Enable JavaScript and reopen this file.</noscript>
<script>
'use strict';
// Source: supplied paper, Figures 1–3 and Sections 3–4. Scene bridges,
// consequence feedback, routing, and the final Dalen decision are adaptations.
const app=document.getElementById('app');
const C=(label,quote,next,feedback)=>({label,quote,next,feedback});
const N=(step,title,scene,choices)=>({step,title,scene,choices});
const nodes={
d1:N(1,'A sharp crack downstairs','May 5, 2025. Your weekly D&D session is upstairs in a quiet comic shop. A sharp crack interrupts the game. No one knows what happened.',[
C('Rush to the door','“I’m going downstairs. If that was a gunshot, seconds matter.”','d2','You move before the group has agreed on a plan. Speed creates an opportunity to act, but your friends are left trying to catch up.'),
C('Freeze and orient the group','“Hold up. Eyes on me. Catch your breath, then we move together.”','d2','You get the group moving together. The pause helps coordination, even as everyone wonders what those seconds might cost.')]),
d2:N(2,'Aftermath in the shop','The immediate danger has passed and emergency help is on the way. Accounts conflict. A missing collection of rare cards, a half-heard name, and an online listing may be connected. What do you do first?',[
C('Question your friends','“Tell me where you were and what you heard, one at a time.”','d3team','You build a shared account. Your friends disagree about the timing, but now the disagreement is visible.'),
C('Observe quietly','“I’m scanning. Give me a minute to take everything in.”','d3solo','A detail in the shop appears to match an online seller. You have a lead, but the group has not checked your interpretation.')]),
d3solo:N(3,'A lead of your own','The online listing looks familiar. The seller’s identity is uncertain. You can pursue the lead, but neither the location nor the connection has been verified.',[
C('Message the seller to arrange a meeting','“Meet me at the drop with the cards. No surprises.”','d4confront','The seller agrees to meet. You gain access quickly, while taking on uncertainty the group has not helped you assess.'),
C('Follow the inferred address','“I need a look at the place before we call anything in.”','d4confront','The address seems plausible, but it rests on an inference. The person you find may have nothing to do with the shop.')]),
d3team:N(3,'Share the findings','The group compares notes. Some want to act tonight; others worry about accusing the wrong person. How do you proceed?',[
C('Submit an anonymous tip and wait','“Tip sent. We document and let them work.”','d4institution','The lead reaches the proper channel. You keep a record, but you have limited visibility into what happens next.'),
C('Tip and verify in parallel','“We share the tip and verify what we can without crossing lines.”','d4coverage','Your friends check public information together. The shared work strengthens the timeline, but deciding when to stop checking is harder.')]),
d4confront:N(4,'The meeting','At the meeting, the person does not match your expectations. A bystander notices the tension and calls authorities. Your earlier observations are being tested.',[
C('Stay and explain','“Hands where I can see them, then talk.”','d5cost','The conversation produces a useful connection, but the pressure has damaged trust. Your confidence does not erase that cost.'),
C('Recognize the mismatch and pull back','“Wait, that’s not them. Pull back.”','d5spiral','You stop before pressing the accusation further. The lead has consumed time and exposed the weakness in your assumption.')]),
d4institution:N(4,'A slow response','Authorities move slowly. Your friends are frustrated and want a visible response tonight.',[
C('Stay patient and document','“We keep a clean record and follow up tomorrow.”','d5partner','The record stays clear. Waiting protects the process, while asking your friends to tolerate uncertainty.'),
C('Submit the complete evidence packet','“We package everything and escalate through the right channel.”','d5partner','Your organized account makes the gaps easier to see. Escalation creates a next step without promising an immediate resolution.')]),
d4coverage:N(4,'The group plans a confrontation','Your public checks strengthen the lead. The group proposes approaching the seller together, but you still do not know how the encounter will unfold.',[
C('Proceed together with a safety plan','“We go as a group with a safety check and a timeline.”','d5cost','The group shares responsibility, yet approaching a suspect still carries risk. Agreement is not the same as certainty.'),
C('Pivot to a full evidence packet','“We package everything and escalate through the right channel.”','d5partner','You turn the group’s work into a traceable record. Some friends feel relieved; others feel the momentum has stalled.')]),
d5cost:N(5,'What goes into the record?','A useful lead has emerged, but moving quickly has strained trust. The final account can preserve both the evidence and the cost of your approach.',[
C('Name the evidence and acknowledge the cost','“I’ll explain what we found and where I moved too fast.”','end:cost','You make room for accountability as well as results.'),
C('Lead with the result','“Start with what we found. That’s what matters tonight.”','end:cost','The lead moves forward. The unanswered questions about your method remain part of the outcome.')]),
d5spiral:N(5,'After the mistaken lead','The solo hunch missed the mark. You can revisit the inference or keep pursuing an uncertain trail.',[
C('Return to the group and verify','“I misread this. Let’s check the timeline together.”','end:spiral','You admit the misread and identify a slower first step for next time.'),
C('Keep searching independently','“There’s another thread here. I want to follow it.”','end:spiral','You keep control of the search, while the earlier assumption remains unresolved.')]),
d5partner:N(5,'Keep the case moving','The record is clean and the process is slower than anyone hoped. Decide how you will sustain the group’s involvement.',[
C('Set a documented follow-up','“We’ll track the response and follow up together.”','end:partner','A shared follow-up gives the group something concrete to do while the case moves.'),
C('Ask for a formal review of the delay','“We can press for an answer and keep the record clear.”','end:partner','You pair patience with a request for accountability rather than treating them as opposites.')]),
x1:N(1,'A sharp crack downstairs','May 5, 2025. Your weekly D&D session is interrupted by a sharp crack from the comic shop below. Your friends look to one another for a response.',[
C('Check social feeds for signals','“If Miasma is bragging, it will hit a feed first.”','x2','You search for a signal quickly. Online claims may provide a lead, but they are not yet verified.'),
C('Stay with the group','“I’m with you. I’ll scan once we’re stable.”','x2','You put the group’s immediate stability first. Information gathering waits until everyone can focus.')]),
x2:N(2,'Triage your focus','Emergency help is on the way. The shop’s accounts conflict, and rumors about missing rare cards are spreading. Your attention is limited.',[
C('Collect public information','“Public only. Keep it clean and traceable.”','x3','You preserve public posts and their context. The record can be checked, but you may miss information that is not public.'),
C('Comfort and stabilize friends','“Breathe with me. One step at a time.”','x3','You help friends articulate what they remember. Supporting them takes time away from the online trail.')]),
x3:N(3,'How far do you go?','A public trail links a seller to the missing cards. A restricted account might contain more, but accessing it would cross a boundary.',[
C('Build a packet from public evidence','“We can build enough without crossing a line.”','x4legal','The public record has gaps, but its origin is traceable and others can review it.'),
C('Use unauthorized access','“I can get in, but the method will not hold up.”','x4grey','You find a stronger-looking link through an unauthorized method. Its source creates a serious problem for using it officially.')]),
x4legal:N(4,'Submit the packet','You have a traceable packet of public evidence. Decide how transparent to be with your friends about the handoff.',[
C('Submit and notify the group','“Sending the packet and looping everyone in.”','x5legal','Your friends understand what was sent and can correct gaps in the account.'),
C('Submit quietly','“I’m submitting it without fanfare. Results first.”','x5legal','The packet is submitted promptly. Your friends are unsure what you shared on their behalf.')]),
x4grey:N(4,'Handle compromised data','The restricted information looks consequential, but your method has compromised the record. Your friends do not know how you obtained it.',[
C('Share with the group and disclose the risk','“You need to see this and how I got it.”','x5grey','Disclosure brings others into the decision, but does not make the access or the evidence legitimate.'),
C('Act on it alone','“I can stop the sale tonight, but I’m on my own.”','x5grey','You act quickly without a shared check on your judgment. Responsibility for the method remains yours.')]),
x5legal:N(5,'An institutional response','The official response is slow. Your record is intact, but the group worries that the lead will go cold.',[
C('Stay visible and keep receipts','“We stay visible and keep receipts.”','end:legal','You preserve continuity and an account of the delay, despite frustration.'),
C('Escalate through a journalist or ombudsperson','“If the queue stalls, I escalate with the facts.”','end:legal','You seek another avenue for accountability. The traceable packet lets you distinguish facts from speculation.')]),
x5grey:N(5,'The edge outcome','Your intervention disrupts the sale, but the restricted material cannot simply become a clean official record. Decide how to account for what happened.',[
C('Adjust around the evidence problem','“The data proves the point, just not in court. We adjust.”','end:grey','The intervention has an effect, but the method limits what others can rely on.'),
C('Own the consequences of the method','“Harm is prevented. I will own my part.”','end:grey','You acknowledge your responsibility. A useful outcome still leaves a question about the rule you crossed.')])};
const endings={cost:['Justice, with a cost','Dalen’s push gets results and the right person is named. Moving fast leaves a bruise on trust. The next challenge is to bring the group along sooner.'],spiral:['Spiral into the archive','The solo hunch misses the mark and burns time. Dalen must name what he would verify before acting and sketch a slower first step for the next high-pressure call.'],partner:['Institutional partner','The record is clean, the process is slower, and the case moves. Dalen sees how patience and documentation protect outcomes, and considers when to wait and when to press.'],legal:['Whistleblower within the lines','The legal packet stands and the response is real, even if delayed. Xania considers how transparency keeps the team involved and how to tighten the evidence trail next time.'],grey:['Greyhat maverick','The move stops harm, yet parts of the file will never be used officially. Xania must name the value she protected and the rule she bent, then plan a cleaner path that still moves quickly.']};
const prompts=['What value governed your most consequential choice: truth, care, safety, fairness, or autonomy? Identify the exact moment it surfaced.','Where did you feel pressure to move faster than you preferred? Where did you slow down despite urgency?','If an action produced a good outcome but violated protocol, was it the right action? Explain using a moment from this story.','At which decisions did peers influence you? Was their influence sought, imposed, or absent? What difference did that make?','Connect one narrative decision to an academic or career situation. If that situation happens, what will you do and why?'];
let state={screen:'intro',character:null,node:null,history:[],ending:null,answers:Array(8).fill(''),mode:'full'}, pending=null;
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function button(label,action,primary=false){return `<button ${primary?'class="primary"':''} data-action="${action}">${label}</button>`}
function refresh(){render();const heading=app.querySelector('h1,h2');if(heading){heading.tabIndex=-1;heading.focus({preventScroll:true});}window.scrollTo(0,0)}
function sidebar(){return `<aside><div class="panel"><div class="eyebrow">Your decision trail</div><p class="muted">${state.character||'No character selected'} · ${state.history.length}/5 decisions</p>${state.history.length?state.history.map(h=>`<div class="receipt"><strong>${esc(h.title)}</strong><p>${esc(h.label)}</p></div>`).join(''):'<p class="notice">Your choices will appear here. There is no score and no assigned personality type.</p>'}</div></aside>`}
function baseRender(){
if(state.screen==='intro'){app.innerHTML=`<div class="grid"><section><div class="eyebrow">An interactive reconstruction / 01</div><h1>The truth is buried<br>in fragments.</h1><p class="lead">One archive. Two perspectives. Five decisions across the days after a death.</p><div class="curator archive-intro"><div class="guide-heading"><span class="guide-icon" aria-hidden="true">M</span><div><h3>Mordecai</h3><span class="eyebrow">Your curator and narrator</span></div></div><p class="notice">Mordecai presents the archive. You make decisions through Dalen or Xania; Mordecai is not your playable character. His connection to the record is revealed gradually.</p><div class="quote"><p>Okay. We’re on.</p><p>I’m Mordecai. I move through recorded human moments and flag the ones worth passing up — violence, love, people making their parents’ mistakes in their parents’ kitchens. I know the shape of those. This is what I do.</p><p>This instance has been flagged as concerning. I’ve had it open longer than usual.</p><p>I keep meaning to close it out.</p><p>I don’t.</p><p>Let me show you what I have.</p></div></div><div class="panel"><h3>Before you begin</h3><p><strong>Ron</strong> owns a comic book and trading-card shop where friends meet to play <strong>Dungeons &amp; Dragons (D&amp;D)</strong>, a collaborative tabletop role-playing game.</p><p><strong>Dalen and Xania</strong> are two friends whose perspectives you can choose. <strong>James, Zachariah, and Lucas</strong> appear in their messages. <strong>Heroes of the Swarm</strong> is the name of their game and group chat.</p><p><strong>Mordecai</strong> is the narrator and curator presenting the records. You do not need to know who he is yet.</p><p><strong>How this version works:</strong> source excerpts establish the situation. You then explore an imagined response and its consequences. After five decisions, you will see how the original story actually unfolded.</p></div><div class="panel student-start"><h3>Your task</h3><p>You are exploring how you make decisions under uncertainty. You do not need D&amp;D knowledge or the original story, and you are not being asked to solve the murder.</p><ol><li><strong>Choose one perspective:</strong> Dalen or Xania.</li><li><strong>At each of five decisions:</strong> read the scene and evidence briefing, then click the response you would choose. The expandable documents give more context.</li><li><strong>Read the consequence:</strong> click Continue to reach the next decision.</li><li><strong>After the ending:</strong> read the final recording, then complete the five reflections or short exit ticket as your instructor directs.</li><li><strong>Save your work:</strong> download your reflection. Submit it only if your instructor asks; this page does not submit anything.</li></ol><p class="notice">Allow 20–30 minutes. Fictional content includes a fatal shooting and grief. Your responses are not a personality test. Closing or refreshing clears this run.</p></div><div class="actions">${button('Enter the archive →','select',true)}${state.node?button('Return to my activity','resume'):''}</div><details><summary>How to play &amp; classroom notes</summary><p style="margin-top:15px">Choose Dalen or Xania as your narrative perspective, then make five decisions using your own reasoning. This is a guided decision activity, not a puzzle: you do not have to identify a culprit or find a hidden answer. Read each consequence, review your trail, and reflect. Allow about 20–30 minutes, or use the short exit ticket.</p><p>This fictional scenario includes a fatal shooting, grief, crime, confrontation, and unauthorized data access; there are no graphic images. You may stop or use an alternative reflection activity. Narrative decisions have no real-world evaluative weight.</p><p>Adapted from Campaign by Roger Gude and the Character.exe paper by Hang Yuan and Roger Gude. Archive documents reproduce the supplied story. Choice dialogue and epilogue themes follow the paper. Decision scenes, feedback, hypothetical branches, and Dalen’s fifth-decision cards are classroom adaptations. The story’s record is revealed after your hypothetical outcome; it is not changed by your choices. Zachariah and Lucas are not playable because the supplied paper develops only two paths.</p><p>No responses are transmitted or stored after closing or refreshing the page. Download your reflection before leaving. Instructors: invite students to explain their reasoning before introducing the archetype vocabulary. Use the file for demonstration and discussion; it does not implement the paper’s planned research study.</p></details></section><aside><div class="archive-art" aria-hidden="true"></div><div class="panel"><div class="eyebrow">Archive status</div><p>Incomplete records.<br>Conflicting memories.<br>Consequences that matter.</p><span class="badge">2 playable perspectives</span><span class="badge">5 decision nodes</span><span class="badge">No fixed labels</span></div><p class="notice">Make choices first. Meet the reflection lenses afterward.</p></aside></div>`;}

else if(state.screen==='play'){const n=nodes[state.node];app.innerHTML=`<div class="grid"><section><div class="eyebrow">${state.character} / Decision ${n.step} of 5</div><div class="progress" aria-label="Decision ${n.step} of 5">${[1,2,3,4,5].map(i=>`<span class="${i<=n.step?'done':''}"></span>`).join('')}</div><h2>${esc(n.title)}</h2><p class="lead">${esc(n.scene)}</p><div class="choices">${n.choices.map((c,i)=>`<button class="choice" data-choice="${i}"><b>0${i+1}</b><div><strong>${esc(c.label)}</strong><span class="muted">${esc(c.quote)}</span></div></button>`).join('')}</div><p class="notice" style="margin-top:20px">Choose the response you would make. Every option involves a tradeoff.</p></section>${sidebar()}</div>`;}
else if(state.screen==='feedback'){app.innerHTML=`<div class="grid"><section><div class="eyebrow">Decision recorded / ${state.history.length} of 5</div><h2>${esc(pending.label)}</h2><p class="quote">${esc(pending.quote)}</p><div class="panel"><div class="eyebrow">What follows</div><p class="lead" style="margin:12px 0 0">${esc(pending.feedback)}</p></div><div class="actions">${button(state.history.length===5?'Read the epilogue →':'Continue →','continue',true)}</div></section>${sidebar()}</div>`;}
else if(state.screen==='end'){const e=endings[state.ending];app.innerHTML=`<div class="grid"><section><div class="eyebrow">${state.character} / Epilogue</div><h1>${esc(e[0])}</h1><p class="lead">${esc(e[1])}</p><div class="panel"><h3>The story ends. The reasoning continues.</h3><p>All events are fictional. Your choices are a starting point for reflection, not a judgment of your character. Different pressures can bring out different responses.</p></div><div class="actions">${button('Open the final recording →','reveal',true)}${button('Replay a perspective','replay')}</div></section>${sidebar()}</div>`;}

${button('Replay a perspective','replay')}</div><p id="message" role="status"></p></section>${sidebar()}</div>`;}

function record(){let text=`Character.exe — Classroom reflection\nPerspective: ${state.character}\nEpilogue: ${endings[state.ending][0]}\n\n${endings[state.ending][1]}\n\nDECISION TRAIL\n`;state.history.forEach((h,i)=>text+=`\n${i+1}. ${h.title}\nChoice: ${h.label}\n${h.quote}\nConsequence: ${h.feedback}\n`);text+='\nREFLECTION\n';if(state.answers[7])text+='\nAfter Ron’s recording: What changed in your understanding of Ron or Mordecai? Compare an earlier remark with the final log, using a detail from the text.\n'+state.answers[7]+'\n';[...prompts,'Exit ticket: What value guided your choice?','Exit ticket: What would you do differently?'].forEach((p,i)=>{if(state.answers[i])text+=`\n${p}\n${state.answers[i]}\n`;});return text+'\nFictional classroom adaptation. No personality score or evaluation.\n';}
function reset(){state={screen:'select',character:null,node:null,history:[],ending:null,answers:Array(8).fill(''),mode:'full'};pending=null;refresh();}
app.addEventListener('input',e=>{if(e.target.dataset.answer!==undefined)state.answers[Number(e.target.dataset.answer)]=e.target.value;});
app.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;
if(b.dataset.character){state.character=b.dataset.character;state.node=state.character==='Dalen'?'d1':'x1';state.history=[];state.ending=null;state.screen='play';refresh();return;}
if(b.dataset.choice!==undefined&&state.screen==='play'){const n=nodes[state.node];pending=n.choices[Number(b.dataset.choice)];state.history.push({...pending,title:n.title,node:state.node});state.screen='feedback';refresh();return;}
const a=b.dataset.action;if(a==='select'){if(state.history.length){state.restartFrom=state.screen;state.screen='restart';refresh();return;}reset();return;}
if(a==='resume'){state.screen=state.returnScreen||(state.ending?'end':pending?'feedback':'play');}
if(a==='continue'){if(pending.next.startsWith('end:')){state.ending=pending.next.slice(4);state.screen='end';}else{state.node=pending.next;state.screen='play';}pending=null;}
if(a==='reflect'||a==='summary'||a==='reveal')state.screen=a;
if(a==='full'||a==='short'){state.mode=a;state.screen='reflect';}
if(a==='replay'){state.restartFrom=state.screen;state.screen='restart';refresh();return;}
if(a==='restart-confirm'){reset();return;}
if(a==='restart-cancel'){state.screen=state.restartFrom||'end';refresh();return;}
if(a==='download'){const blob=new Blob([record()],{type:'text/plain;charset=utf-8'}),url=URL.createObjectURL(blob),link=document.createElement('a');link.href=url;link.download=`Character-exe-${state.character}-reflection.txt`;document.body.append(link);link.click();link.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);const m=document.getElementById('message');if(m)m.textContent='Reflection download requested. Check your browser’s downloads.';return;}

const archive={"interview": {"title": "A customer remembers Ron", "date": "May 6 · Interview transcript", "text": "RECORDED INTERVIEW TRANSCRIPT\n\nCase No.: ___________\n\nDate: 05.06.2025\n\nSubject: [name redacted]\n\nRelation to victim: Regular customer, approximately 20 years\n\nI’ve been coming in since the nineties. That’s a long time to know somebody, even if you don’t really know them.\n\nHe was always there. That was the thing about Ron. You’d walk in and he’d be behind the counter and that was just how it was. In the nineties he had this long hair, big glasses, a different band shirt every week. He’d light up when you bought something he liked too. That was the thing — he had opinions. Over time the shirts stopped, the hair went, and that — that enthusiasm, I guess — that went too. Like a statue in a courtyard or something, just — I don’t know why I said that. You stop noticing until you’re standing in a police station trying to describe somebody.\n\nLast week something was off. The room upstairs was locked when we got there, which it never is. We had to find him. He was up front reading something on his phone and he didn’t hear us at first. Dalen had to knock on the counter a few times before he looked up. He apologized. I don’t think he meant it, but I don’t think he didn’t mean it either. He just said it.\n\nI don’t know. I keep trying to figure out what I actually knew about him."}, "incident": {"title": "The incident report", "date": "May 5 · Filed after the discovery", "text": "INCIDENT REPORT\n\nReporting Officer: ___________\n\nCase No.: ___________\n\nDate of Incident: 05.05.2025\n\nTime: Approximately 21:00\n\nLocation: [store name], [address redacted]\n\nResponding officers arrived on scene at 21:14 following a 911 call placed at 21:08. Upon entry officers discovered the victim, [Ron — last name], deceased behind the front register. Cause of death: single gunshot wound to the chest. Time of death estimated between 20:45 and 21:05.\n\nFour witnesses were present on the second floor of the premises at the time of the incident. Witnesses reported hearing a single loud sound consistent with a gunshot and descended to the ground floor approximately one to two minutes later. Witnesses did not observe the perpetrator. No other individuals were present on the premises at the time of discovery.\n\nThe store’s rear exit was found open. No signs of forced entry at any point of access. The register was closed and undisturbed. Display cases in the front window were intact.\n\nSecurity footage, internal, 05.05.2025, 18:00–21:14 collected for review. Footage from 20:43–21:02 absent due to apparent system interruption.\n\nEvidence collected at scene:\n\n— Personal effects of victim\n\n— Security footage drive\n\n— One [make/model] firearm recovered from the waistband of the victim. Unfired. No rounds discharged."}, "chat": {"title": "Are you home?", "date": "May 5 · 21:34–22:13", "text": "Heroes of the Swarm — 05.05.2025\n\nDalen  21:34\n\nguys\n\nDalen  21:34\n\nguys are you home\n\nDalen  21:34\n\nis everyone okay\n\nJames  21:36\n\nYeah. Just got in. Still shaking a little.\n\nZachariah  21:37\n\nI can’t believe what just happened. I genuinely cannot process this. Ron is gone. He’s actually gone. I keep seeing it every time I close my eyes.\n\nDalen  21:38\n\nyeah\n\nDalen  21:38\n\nyeah man\n\nDalen  21:39\n\nLucas you good\n\nLucas liked ‘Lucas you good’\n\nJames  21:42\n\nHas anyone talked to the police since we left\n\nZachariah  21:43\n\nThey said they’d follow up tomorrow. I don’t know what else we could tell them honestly. We didn’t see anything. We were just up there playing and then—\n\nDalen  21:44\n\ndon’t\n\nDalen  21:44\n\nyeah don’t finish that\n\nXania  21:51\n\nSorry I went quiet. Had to decompress for a second. James are you okay? Everyone okay?\n\nJames  21:53\n\nI think so. As okay as you can be I guess.\n\nXania  21:54\n\nYeah.\n\nLucas liked ‘Yeah.’\n\nDalen  21:55\n\nwhat do we do\n\nJames  21:58\n\nI don’t know. Nothing tonight I think. Nothing we can do tonight.\n\nZachariah  22:01\n\nI just keep thinking about his eyes. The way they were just open like that. I’ve never seen a dead person before. I don’t think I’ll ever be the same after this honestly.\n\nDalen  22:02\n\nZach\n\nDalen  22:02\n\nbro\n\nDalen  22:02\n\nmaybe save that for therapy\n\nXania liked ‘maybe save that for therapy’\n\nLucas liked ‘maybe save that for therapy’\n\nZachariah  22:04\n\nI’m just being honest about how I feel Dalen. Some of us process out loud.\n\nDalen  22:05\n\nno I know I’m sorry\n\nDalen  22:05\n\nI just don’t know what to do with any of this\n\nJames  22:09\n\nNone of us do. Let’s just get some sleep. We can figure out next steps tomorrow.\n\nZachariah liked ‘None of us do. Let’s just get some sleep. We can figure out next steps tomorrow.’\n\nLucas liked ‘None of us do. Let’s just get some sleep. We can figure out next steps tomorrow.’\n\nXania  22:11\n\nYeah. Everyone be safe. We’ll talk tomorrow.\n\nDalen  22:12\n\nyeah\n\nDalen  22:12\n\nnight guys\n\nDalen  22:13\n\nthis is so messed up"}, "news": {"title": "The neighborhood responds", "date": "May 6 · Evening news", "text": "LOCAL NEWS TRANSCRIPT\n\nChannel [redacted] Evening News / 05.06.2025\n\nAnchor: [name redacted] / Field Reporter: [name redacted]\n\nANCHOR: Police are investigating a homicide at a local comic book and card shop after the owner was found dead inside the business last night. The victim has been identified as Ron [last name redacted], who had operated the shop for nearly twenty years. The store was known in the area for its sidewalk sales and regular gaming events. Its social media page posted this morning that it is currently closed indefinitely. [Reporter], what are people saying?\n\nREPORTER: It’s been a quiet day out here. The shop has been dark since last night, and most people are just stopping to look — a few left things at the door. For a lot of people on this block, it was part of the landscape. I spoke with a neighboring business owner who had a shop near the victim for years.\n\nNEIGHBORING BUSINESS OWNER: Honestly, we never had much to say to each other, and him to me — which worked fine. You know how neighbors are. He was there, I was here. Nice guy. Real shame what happened.\n\nBut this used to be a safe block. Good people, quiet, nobody bothering anybody. Something like this right next door — you start to wonder. What is this place turning into? That’s the question I keep coming back to.\n\nRon grew up around here, from what I understand. So that makes it worse, I think. That makes it worse.\n\nREPORTER: Police are asking anyone with information to contact the department’s anonymous tip line. No arrests have been announced. Reporting live, [name redacted], Channel [redacted] News.\n\nANCHOR: Thank you. We’ll continue to follow this story as it develops."}, "sheet": {"title": "Douglass: a character sheet", "date": "Archive insert · Heroes of the Swarm", "text": "CHARACTER SHEET\n\nCampaign: Heroes of the Swarm\n\nName: Douglass\n\nClass: Rogue — Arcane Trickster\n\nAlignment: Chaotic Good\n\nSpecial Abilities:\n\nArcane Trickster — Supplements stealth and theft with illusion and enchantment magic. Accesses what others cannot through a combination of technical skill and misdirection.\n\nMage Hand Legerdemain — Can manipulate objects, unlock mechanisms, and retrieve information remotely without leaving a trace.\n\nFlaws:\n\nFinds it difficult to trust others with what she knows."}, "listing": {"title": "Look at the listing date", "date": "May 10 · 16:22 onward", "text": "Heroes of the Swarm — 05.10.2025\n\nDalen  16:22\n\nguys\n\nDalen  16:22\n\nokay this might be nothing\n\nDalen  16:23\n\n[link]\n\nDalen  16:23\n\nlook at the card\n\nDalen  16:24\n\nlook at the listing date\n\nZachariah  16:31\n\nWait. Is that the Charizard from the case? The one he wouldn’t sell? I’m trying to make sense of this. That can’t be a coincidence right? He talked about that card all the time. He literally would not let people touch the glass.\n\nJames  16:34\n\nCould be a different one.\n\nDalen  16:35\n\nbro\n\nDalen  16:35\n\nPSA 10 shadowless first edition\n\nDalen  16:35\n\nhow many of those exist\n\nJames  16:38\n\nFair.\n\nZachariah  16:41\n\nOkay but who is selling it. Is there a name on the listing. Can we see the seller. This is so weird. Why would someone — sorry I keep going in circles.\n\nDalen  16:42\n\nusername only\n\nDalen  16:42\n\nMValento92\n\nDalen  16:43\n\nmeans nothing to me\n\nLucas liked ‘means nothing to me’\n\nJames  16:48\n\nWhen was it listed.\n\nDalen  16:49\n\n05.06\n\nDalen  16:49\n\nthe morning after\n\nJames  16:52\n\nOkay.\n\n[Silence — about three hours]"}, "tip": {"title": "A tip received", "date": "May 10 · 22:47", "text": "ANONYMOUS TIP CONFIRMATION\n\nSubmission Method: Online Form\n\nDate: 05.10.2025\n\nTime of Submission: 22:47\n\nConfirmation Number: TIP-20250510-48217\n\nSubject: Information regarding Case #___ — Homicide — [store name redacted], [city redacted]\n\nAttachments: 4 files received\n\nYour tip has been received and entered into the case file. Submissions are routed to the lead investigator assigned to the referenced case file. Review timelines vary based on case priority and available resources.\n\nYou may be contacted if we require additional information. To remain anonymous, you may decline further contact at the time of any follow-up.\n\nThank you for your assistance."}, "video": {"title": "One more thing", "date": "Recorded April 29 · Video transcript", "text": "VIDEO TRANSCRIPT\n\nSource: [redacted] / [redacted]\n\nDate of recording: 04.29.2025\n\nDuration: 4:17\n\n[recording begins mid-frame; sound of register printer in background]\n\nHi guys! Thanks for tuning in again. I’m Ron, the Card Breaker, and we’ve got something special for you today.\n\nYou see, if you are just joining this channel, you may want to catch up by watching my last few videos. Some context, some backstory, you know. I’m an avid DM and Magic player, and I’ve always wanted to create my own material for my games. So. Look what we’ve got here.\n\nIt’s my very own card deck.\n\n[holds up cards to camera]\n\nThese are cards that show off my life here at the shop. We’ve got the building card, look how cool that is. The artist drew the chip in the brick out front. The one nobody notices. I notice.\n\nAnd this one, you all know Hobo Joe, standing out there on the corner. I’ve even generated him with a party hat and his skateboard. Joe’s a signpost around here. You see him, you know you’re almost at the shop.\n\n[laughs]\n\nAnd this one. Well. It’s you. Look, I made a fan.\n\n[holds card closer to camera]\n\nThat’s not a specific you. That’s a — that’s everybody who watches. I figured if I’m gonna make a deck of my life, you’re in it. You’re part of the shop. Whether you’ve been in or not.\n\nSo. This card set is a special one for me, but we’ve finally made an agreement with a local printer to have custom made DnD sets and Card Decks for anyone. Any user. You want a deck of your life? We can do that now. We can do that for you.\n\nI’ve got mine.\n\nBut the bigger part, the part that’s occupied more of my life than anything else, is —\n\n[shuffles papers]\n\n— my DnD custom character sheet and map.\n\nMy warlock. Mordecai. Look at that.\n\n[holds sheet to camera]\n\nLook how badass his cloak is. I love him.\n\nWe are planning to run a new campaign. More on that next time.\n\n[off-camera, muffled] Hey Ron — can I hit the restroom real quick?\n\nYeah, Joe, go for it.\n\n[recording ends]"}, "lastlog": {"title": "Mordecai cannot close the record", "date": "May 13 · 03:14", "text": "LOG 1-1-7491 / Timestamp 05.13.2025 / 03:14\n\nAt this point, it’s resolved, right? I’d like to think so. They did it. Tip submitted. Perp arrested.\n\n…Except not. Not really. I mean, sure. Mason Valento is in custody. The evidence is clean. The case will move. That’s what cases do.\n\nWhat’s going to happen? I don’t know, is it justice? I don’t know at this point.\n\nI don’t have to get involved. I observe.\n\nBut every voice came from somewhere. Every voice was somebody’s first. You don’t think about it.\n\nThere was a person behind the counter for twenty years and somebody in a police station reached for a word they didn’t know they had and the word was statue and I can’t stop thinking about that. You can’t take it back. It’s in the record now.\n\nI’ve already acted. I did the work.\n\nThere’s one more thing. I’ll get to it.\n\nI will."}, "findings": {"title": "Three days of silence", "date": "May 10 · 19:47–20:24", "text": "Xania  19:47\n\nSorry I’ve been quiet. I needed to look at some things before I said anything.\n\nXania  19:48\n\nMValento92 is Mason Valento. He’s been in the shop. Dalen you’ve met him. Tall, oversized hoodie, kind of sloppy. Blends into the wall. You’ve met him. You just don’t remember.\n\nDalen  19:49\n\noh\n\nDalen  19:49\n\noh no\n\nXania  19:51\n\nHe has six other listings under that account going back to February. Three of them are cards I’m pretty sure were Ron’s. The Charizard I can prove. Ron kept his own inventory records. Photographed everything that mattered for insurance.\n\nXania  19:52\n\nIt matches.\n\nZachariah  19:54\n\nXania what\n\nZachariah  19:54\n\nhow long have you been sitting on this\n\nXania  19:56\n\nThree days.\n\nXania  19:57\n\nI wanted to be sure.\n\nDalen  19:58\n\ndouglass\n\nXania liked ‘douglass’\n\n[Silence — about four minutes]\n\nJames  20:09\n\nThis needs to go to the police.\n\nJames  20:10\n\nTonight if possible.\n\nXania  20:12\n\nI’ll handle it.\n\nJames  20:13\n\nXania.\n\nXania  20:14\n\nI’ll handle it tonight. I have everything in one place. It’ll be cleaner coming from one person.\n\nZachariah  20:16\n\nAre you sure. We can all go. We were all there.\n\nXania  20:17\n\nI’m sure.\n\nLucas liked ‘I’m sure.’\n\nDalen  20:22\n\nlet us know when it’s done\n\nZachariah  20:24\n\nyeah let us know what you need\n\nZachariah  20:24\n\nwhatever it is. we got you\n\nLucas liked ‘whatever it is. we got you’"}};

briefings[3]=['Charizard is a collectible Pokémon trading card. “PSA 10 shadowless first edition” describes the highly graded version discussed in the chat; you do not need card-collecting knowledge.','The listing is dated May 6 and uses the username MValento92. Dalen thinks it may be Ron’s card; James says it could be another copy. Neither statement establishes guilt.','At this point, the source excerpt does not establish the seller’s identity or how further records might be obtained. Choose using the uncertainty you have now.'];
briefings[4]=['Your previous consequence establishes the situation on this imagined route.','Use that situation to choose how you involve friends, handle uncertainty, or hand off information.','The original story’s later messages are reserved for the final comparison so they do not tell you which response to choose.'];
briefings[5]=['This is the last decision in your imagined route. Refer to your decision trail if you need a reminder.','Choose how to follow through or account for the consequences of your earlier actions.','After this choice, you will read your branch ending, then compare it with the source story.'];
logs[4]='Next document.';

 if(state.screen==='restart'){

 }
 if(state.screen==='reveal'){
 app.innerHTML=`<div class="eyebrow">The source story / Final archive</div><h1>Mordecai’s final record.</h1><div class="curator guide"><div class="guide-heading"><span class="guide-icon" aria-hidden="true">M</span><div><h3>Mordecai</h3><span class="eyebrow">The narrator returns</span></div></div><p class="quote">“I’ve already acted. I did the work. There’s one more thing. I’ll get to it. I will.”</p><p>Read the remaining source records below. These describe the original story, which may differ from your imagined route.</p></div><p class="lead">Your hypothetical path is complete. Now return to what happened in <em>Campaign</em>.</p><div class="panel"><h3>What to do here</h3><p>Read the source-story outcome, then the expanded recording below. Compare it with your imagined route. When you are ready, click Continue to reflection.</p></div><div class="panel"><h3>How the source story unfolded</h3><p>Later on May 10, Xania identifies the seller as Mason Valento and says Ron’s inventory photographs match the Charizard. She says she waited three days to be sure. James asks that the information go to police, and Xania says she will handle it. The story does not specify how she obtained the inventory records.</p>${artifact('findings')}<details><summary>Douglass: Xania’s game character (optional context)</summary><p>Dalen calls Xania “Douglass” in the chat. This character sheet belongs to the role-playing game; its fictional abilities are not proof of what Xania did outside the game.</p>${artifact('sheet')}</details><h3>A received tip. A case that moves.</h3><p>In the source story, Xania submits four files on May 10. Mordecai’s May 13 log says Mason Valento is in custody and the evidence is clean. Yet he cannot settle the question of justice—or close the record.</p>${artifact('tip')}${artifact('lastlog',true)}</div><div class="panel"><div class="eyebrow">Recorded before the incident</div><h2>Ron, the Card Breaker.</h2><p>This is a written video transcript from the story. Read it through to the character sheet near the end. Then click Continue to reflection below. No video playback is required.</p>${artifact('video',true)}<p class="quote">“My warlock. Mordecai. Look at that.”</p><p>You have now reached the end of the source story. Continue to reflection to consider your choices and, optionally, Mordecai’s connection to Ron.</p></div><div class="actions">${button('Continue to reflection →','reflect',true)}${button('Review my outcome','outcome')}</div>`;return;
 }
 baseRender();
 if(state.screen==='play'){
 const n=nodes[state.node],section=app.querySelector('section');
 const keys=focusDocs[n.step]||[];
 const previous=[...new Set(Object.entries(focusDocs).filter(([step])=>Number(step)<n.step).flatMap(([,keys])=>keys))];
 const container=document.createElement('div');container.className='artifact-list';container.innerHTML=`<span class="archive-meta">${dated[state.node]||'May 11 · Follow-up'} · Hypothetical decision scene</span>${guideCard(n.step)}<div class="panel"><div class="eyebrow">Read → consider → choose</div><h3>What you know at this point</h3><ul>${briefings[n.step].map(s=>`<li>${esc(s)}</li>`).join('')}</ul><p><strong>Your next step:</strong> ${esc(tasks[state.node]||'Compare the two responses below. Click the one you would choose, then read what follows.')}</p></div>${keys.length?'<h3>Source documents for this decision</h3><p class="notice">The briefing above is enough to proceed. Expand these for the original dialogue and detail. These fixed documents show the source story; they do not change with your hypothetical choices.</p>'+keys.map(key=>artifact(key)).join(''):''}${previous.length?'<details><summary>Earlier source documents (optional)</summary>'+previous.map(key=>artifact(key)).join('')+'</details>':''}${n.step>=2?'<details><summary>Additional story context (optional)</summary>'+['interview','news'].map(key=>artifact(key)).join('')+'</details>':''}<p class="choice-instruction"><strong>Choose now:</strong> click one of the two responses below. You do not need to open every document.</p>`;
 section.insertBefore(container,section.querySelector('.choices'));
 }
 if(state.screen==='end'){
 const section=app.querySelector('section'),note=document.createElement('p');note.className='notice';note.textContent='Hypothetical branch outcome, adapted from the paper. The source story’s outcome follows in the final archive. Choices can change feedback or the route without producing a different ending; there is no winning score.';section.insertBefore(note,section.querySelector('.actions'));
 }
 if(state.screen==='reflect'){

 if(state.screen==='summary'&&state.answers[7]){const extra=document.createElement('div');extra.className='panel';extra.innerHTML=`<h3>${esc(extraPrompt)}</h3><p class="print-answer">${esc(state.answers[7])}</p>`;app.insertBefore(extra,app.querySelector('.actions'));}
}
app.addEventListener('click',e=>{if(e.target.closest('[data-action="outcome"]')){state.screen='end';refresh();}});

document.getElementById('home').onclick=()=>{state.returnScreen=state.screen;state.screen='intro';refresh();};render();
</script></body></html>
